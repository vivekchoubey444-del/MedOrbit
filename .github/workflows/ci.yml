name: MedOrbit CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check Node syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Validate environment configuration
        run: node config/validate-env.js

      - name: Audit site links
        run: python3 scripts/audit_site.py

      - name: Validate JSON data
        run: python3 scripts/validate_data.py

      - name: Check secrets accidentally committed
        run: python3 scripts/check_secrets.py
