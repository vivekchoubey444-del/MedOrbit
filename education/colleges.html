<body><header class="header"><div class="container nav"><a class="brand" href="/"><span class="brand-mark">M</span><span>MEDORBIT<small>EDUCATION · CAREERS · GROWTH</small></span></a><nav class="nav-links"><a href="/">Home</a><a href="/education/mbbs.html">Education</a><a href="/career/jobs.html">Jobs</a><a href="/auth/login.html">Login</a><a class="btn btn-gold" href="/auth/register.html">Register</a></nav></div></header>
<main class="form-page"><div class="container"><span class="eyebrow">MedOrbit</span><h1>Colleges</h1><p class="section-intro">Browse the institution directory.</p><div id="catalog" class="content-list"><div class="content-row">Loading college directory…</div></div><script>fetch("/assets/data/colleges.json").then(r=>r.json()).then(d=>{const a=Array.isArray(d)?d:d.items||[];const c=document.getElementById("catalog");c.replaceChildren();if(!a.length){c.textContent="No college records have been added yet.";return}a.forEach(x=>{const el=document.createElement("div");el.className="content-row";const h=document.createElement("h3");h.textContent=x.name||x.title||"College";el.appendChild(h);const p=document.createElement("p");p.textContent=x.location||x.description||"";el.appendChild(p);c.appendChild(el)})}).catch(()=>document.getElementById("catalog").textContent="Unable to load colleges.");</script></div></main>
<footer class="footer"><div class="container"><a class="brand" href="/">MEDORBIT</a><p>© <span id="year"></span> MedOrbit</p></div></footer></body></html>
