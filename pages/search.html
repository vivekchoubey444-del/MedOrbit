<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | MedOrbit</title><link rel="stylesheet" href="/assets/css/royal-sapphire.css"><script src="/assets/js/app.js" defer></script></head>
<body><header class="header"><div class="container nav"><a class="brand" href="/"><span class="brand-mark">M</span><span>MEDORBIT<small>EDUCATION · CAREERS · GROWTH</small></span></a><nav class="nav-links"><a href="/">Home</a><a href="/education/mbbs.html">Education</a><a href="/career/jobs.html">Jobs</a><a href="/auth/login.html">Login</a><a class="btn btn-gold" href="/auth/register.html">Register</a></nav></div></header>
<main class="form-page"><div class="container"><span class="eyebrow">MedOrbit</span><h1>Search</h1><p class="section-intro">Search the MedOrbit directory.</p><form class="main-search" id="pageSearch"><input id="q" aria-label="Search" placeholder="Search MedOrbit"><button class="btn btn-gold">Search</button></form><div id="results" class="content-list" style="margin-top:15px"></div><script>const params=new URLSearchParams(location.search);document.getElementById("q").value=params.get("q")||"";document.getElementById("pageSearch").addEventListener("submit",async e=>{e.preventDefault();const q=document.getElementById("q").value;const c=document.getElementById("results");c.textContent="Searching…";try{const r=await fetch("/api/v1/search?q="+encodeURIComponent(q));const d=await r.json();c.replaceChildren();if(!d.results.length){c.textContent="No matching results.";return}d.results.forEach(x=>{const el=document.createElement("div");el.className="content-row";const a=document.createElement("a");a.href=x.url;a.textContent=x.title;el.appendChild(a);c.appendChild(el)})}catch(_){c.textContent="Search unavailable."}});if(document.getElementById("q").value)document.getElementById("pageSearch").requestSubmit();</script></div></main>
<footer class="footer"><div class="container"><a class="brand" href="/">MEDORBIT</a><p>© <span id="year"></span> MedOrbit</p></div></footer></body></html>
