<body><header class="header"><div class="container nav"><a class="brand" href="/"><span class="brand-mark">M</span><span>MEDORBIT<small>EDUCATION · CAREERS · GROWTH</small></span></a><nav class="nav-links"><a href="/">Home</a><a href="/education/mbbs.html">Education</a><a href="/career/jobs.html">Jobs</a><a href="/auth/login.html">Login</a><a class="btn btn-gold" href="/auth/register.html">Register</a></nav></div></header>
<main class="form-page"><div class="container"><span class="eyebrow">MedOrbit</span><h1>Jobs</h1><p class="section-intro">Browse verified job opportunities.</p><div id="jobsList" class="content-list"><div class="content-row">Loading job listings…</div></div><script>fetch("/api/v1/search?q=job").then(r=>r.json()).then(d=>{const c=document.getElementById("jobsList");c.replaceChildren();const items=(d.results||[]).filter(x=>(x.category||"")==="jobs");if(!items.length){c.textContent="No job listings are published yet. Add verified opportunities to assets/data/jobs.json.";return}items.forEach(x=>{const el=document.createElement("div");el.className="content-row";const a=document.createElement("a");a.href=x.url||"#";a.textContent=x.title;el.appendChild(a);c.appendChild(el)})}).catch(()=>document.getElementById("jobsList").textContent="Unable to load jobs.");</script></div></main>
<footer class="footer"><div class="container"><a class="brand" href="/">MEDORBIT</a><p>© <span id="year"></span> MedOrbit</p></div></footer></body></html>
