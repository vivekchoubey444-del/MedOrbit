<head>

<body>
<header class="mo-site-header"><a class="mo-brand" href="/">MED<span>ORBIT</span>S</a><nav class="mo-nav"><a href="/">Home</a><a href="/auth/register.html">Create account</a><a href="/pages/document-template.html">Document Studio</a></nav></header>
<main class="mo-container mo-section">
<section class="mo-hero"><p class="mo-gold">YOUR MEDORBIT ACCOUNT</p><h1>Welcome back.</h1><p>Sign in to access your MedOrbits workspace.</p></section>
<form class="mo-card mo-form-card" data-mo-auth="login">
<h2>Sign in</h2>
<label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in securely</button><p class="mo-status" role="status" aria-live="polite"></p>
<p class="mo-small">New to MedOrbits? <a href="/auth/register.html">Create an account</a>.</p>
</form>
</main><footer class="mo-site-footer">MedOrbits · Royal Sapphire Design System</footer>
