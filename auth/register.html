<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account | MedOrbits</title>
<link rel="stylesheet" href="/assets/css/royal-sapphire.css">
<script src="/assets/js/medorbits-global.js" defer></script>
</head>
<body>
<header class="mo-site-header"><a class="mo-brand" href="/">MED<span>ORBIT</span>S</a><nav class="mo-nav"><a href="/">Home</a><a href="/auth/login.html">Sign in</a><a href="/pages/document-template.html">Document Studio</a></nav></header>
<main class="mo-container mo-section">
<section class="mo-hero"><p class="mo-gold">JOIN MEDORBIT</p><h1>Create your account.</h1><p>One workspace for your guidance, documents and profile.</p></section>
<form class="mo-card mo-form-card" data-mo-auth="register">
<h2>Register</h2>
<label for="name">Full name</label><input id="name" name="name" autocomplete="name" required>
<label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required>
<label for="password">Password</label><input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required><p class="mo-small">Use at least 12 characters. The server must enforce password rules too.</p>
<button type="submit">Create account</button><p class="mo-status" role="status" aria-live="polite"></p>
<p class="mo-small">Already registered? <a href="/auth/login.html">Sign in</a>.</p>
</form>
</main><footer class="mo-site-footer">MedOrbits · Account services</footer>
<script src="/assets/js/medorbit-global.js" defer></script>
</body></html>
